name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-linux:
    name: Moteur métier (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Tests DevisMinuteKit
        run: swift test --package-path DevisMinuteKit

  ios:
    name: Application iOS (Xcode)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Versions
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -m 5 iPhone || true
      - name: Tests DevisMinuteKit (macOS)
        run: swift test --package-path DevisMinuteKit
      - name: Compilation et tests de l'application
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available | grep -m 1 -o 'iPhone [0-9][0-9]* *[A-Za-z]*' | sed 's/ *$//')
          echo "Simulateur : $DEVICE"
          xcodebuild test \
            -project DevisMinute.xcodeproj \
            -scheme DevisMinute \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log | grep -E "error:|warning: .*(isolated|Sendable)|Test Suite|Executed|BUILD|TEST" || true
          grep -q "TEST SUCCEEDED" xcodebuild.log
      - name: Journal en cas d'échec
        if: failure()
        run: grep -E "error:" -A3 xcodebuild.log | head -200 || true
