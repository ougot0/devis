name: Captures d'écran

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    name: Captures sur simulateur iPhone
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compilation (Debug, simulateur)
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available | grep -m 1 -o 'iPhone [0-9][0-9]* Pro Max' || xcrun simctl list devices available | grep -m 1 -o 'iPhone [0-9][0-9]*')
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcodebuild build -project DevisMinute.xcodeproj -scheme DevisMinute -configuration Debug \
            -destination "platform=iOS Simulator,name=$DEVICE" -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            | grep -E "error:|BUILD" || true
          test -d build/Build/Products/Debug-iphonesimulator/DevisMinute.app
      - name: Lancement et captures (mode démonstration, données fictives)
        run: |
          mkdir -p shots
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/DevisMinute.app
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 || true
          capture() {
            xcrun simctl terminate "$DEVICE" com.devisminute.app 2>/dev/null || true
            xcrun simctl launch "$DEVICE" com.devisminute.app -DemoScreen "$1"
            sleep 9
            xcrun simctl io "$DEVICE" screenshot "shots/$2.png"
          }
          xcrun simctl ui "$DEVICE" appearance light
          capture onboarding 01-assistant
          capture dashboard 02-accueil
          capture quotes 03-devis
          capture editor 04-editeur-devis
          capture preview 05-apercu-pdf
          capture invoices 06-factures
          capture detail 07-fiche-facture
          capture customers 08-clients
          capture statistics 09-statistiques
          capture more 10-plus
          capture signature 13-signature-client
          capture signed 14-devis-signe
          capture signedpdf 15-pdf-signe
          capture reminder 16-relance
          xcrun simctl ui "$DEVICE" appearance dark
          capture dashboard 11-accueil-sombre
          capture editor 12-editeur-sombre
          ls -la shots
      - uses: actions/upload-artifact@v4
        with:
          name: captures
          path: shots/*.png
      - name: Enregistrer les captures dans docs/captures
        run: |
          mkdir -p docs/captures
          for f in shots/*.png; do sips -Z 1100 "$f" --out "docs/captures/$(basename "$f")" >/dev/null; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/captures
          git diff --cached --quiet || git commit -m "Captures d'écran automatiques (simulateur, données fictives)"
          git push origin HEAD:${GITHUB_REF_NAME}
