# Spécification XcodeGen (https://github.com/yonaskolb/XcodeGen) — alternative de secours
# au projet DevisMinute.xcodeproj fourni. Usage : `xcodegen generate` à la racine du dépôt.
name: DevisMinute
options:
  bundleIdPrefix: com.devisminute
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
  createIntermediateGroups: true
packages:
  DevisMinuteKit:
    path: DevisMinuteKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  DevisMinute:
    type: application
    platform: iOS
    sources:
      - path: DevisMinute
    dependencies:
      - package: DevisMinuteKit
        product: DevisCore
      - package: DevisMinuteKit
        product: DevisPDF
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devisminute.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Config/DevisMinute.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: DevisMinute
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Face ID permet de verrouiller l'accès à vos devis et factures."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - DevisMinuteTests
      storeKitConfiguration: Config/Products.storekit
  DevisMinuteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DevisMinuteTests
    dependencies:
      - target: DevisMinute
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devisminute.app.tests
        GENERATE_INFOPLIST_FILE: YES
